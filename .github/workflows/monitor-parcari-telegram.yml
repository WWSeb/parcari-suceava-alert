name: Monitor parcari Tineretului-Prieteniei
'on':
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: monitor-parcari-prieteniei
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descarca proiectul
        uses: actions/checkout@v4
      - name: Pregateste Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instaleaza browserul
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Verifica locurile si trimite alerte
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_parcari.py
      - name: Salveaza starea
        run: |
          test -f stare-parcari.json || (echo "Lipseste stare-parcari.json" && exit 1)
          git add stare-parcari.json
          if git diff --cached --quiet; then
            echo "Starea nu s-a modificat"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizare stare parcari"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Incarca raportul la eroare
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raport-monitor
          path: raport-monitor/
          if-no-files-found: ignore
          retention-days: 2
